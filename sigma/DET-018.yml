title: 'Firewall opened for inbound traffic, firewall turned off, or port forward created'
id: '351314ea-4e88-5768-8a3a-0e75fa6393b3'
name: detlab_det_018
status: experimental
description: 'The netsh command was used to add an inbound "allow" firewall rule, to turn the host firewall off, or to create a port forward (portproxy). Attackers do this to let their tool accept connections, to remove a barrier, or to relay traffic through a host they control. The command is also normal for administrators, so this is a medium severity signal that needs context (who, which port, was there a ticket).'
author: 'Detection Lab'
date: '2026-11-04'
tags:
  - attack.defense-impairment
  - attack.t1686
  - attack.t1090.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    Image|endswith: '\netsh.exe'
    CommandLine|re|i|all:
      - 'advfirewall\s+firewall\s+add\s+rule'
      - 'dir=in\b'
      - 'action=allow'
  selection_2:
    Image|endswith: '\netsh.exe'
    CommandLine|re|i: 'advfirewall\s+set\s+\S+\s+state\s+off'
  selection_3:
    Image|endswith: '\netsh.exe'
    CommandLine|re|i: 'firewall\s+set\s+opmode\s+(mode=)?disable'
  selection_4:
    Image|endswith: '\netsh.exe'
    CommandLine|re|i: 'interface\s+portproxy\s+add'
  selection_5:
    OriginalFileName: netsh.exe
    CommandLine|re|i|all:
      - 'advfirewall\s+firewall\s+add\s+rule'
      - 'dir=in\b'
      - 'action=allow'
  selection_6:
    OriginalFileName: netsh.exe
    CommandLine|re|i: 'advfirewall\s+set\s+\S+\s+state\s+off'
  selection_7:
    OriginalFileName: netsh.exe
    CommandLine|re|i: 'firewall\s+set\s+opmode\s+(mode=)?disable'
  selection_8:
    OriginalFileName: netsh.exe
    CommandLine|re|i: 'interface\s+portproxy\s+add'
  condition: 'selection_1 or selection_2 or selection_3 or selection_4 or selection_5 or selection_6 or selection_7 or selection_8'
falsepositives:
  - 'Administrators opening a port for a new service; installers that add their own firewall rule.'
  - 'Known benign source at the lab site, not part of this export: The monitoring agent needs one inbound port on the file server (ticket IT-2301). Pinned to this admin, this host AND the rule name, so any other firewall change still alerts.'
level: medium
