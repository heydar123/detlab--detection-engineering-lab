<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="lab-token" content="__LAB_TOKEN__">
<title>Detection Lab</title>
<style>
/* ---------- tokens ---------- */
:root {
  color-scheme: light;
  --page: #f3f5f8;
  --surface: #fcfdfe;
  --sunken: #eceff4;
  --ink: #1b2330;
  --ink2: #4b5565;
  --muted: #5f6a7b;
  --line: #dfe4ec;
  --axis: #c4ccd8;
  --wash: rgba(27, 35, 48, 0.05);
  --accent: #2a78d6;        /* series 1: real attack alerts */
  --accent-ink: #1c5cab;    /* accent used as text or a small line */
  --accent-wash: rgba(42, 120, 214, 0.10);
  --orange: #eb6834;        /* series 2: false alarms */
  --attack: #6b7585;        /* the planted attacks (reference marks, not a series) */
  --btn: #256abf;
  --good: #0ca30c;
  --good-ink: #006300;
  --serious: #ec835a;
  --crit: #d03b3b;
  --crit-ink: #b02a2a;
  --focus: #2a78d6;
  --shadow: 0 10px 32px rgba(27, 35, 48, 0.16);
  /* coverage levels: one blue ramp, validated as an ordinal scale (steps 250, 500, 650 of the blue ramp) */
  --lv1: #86b6ef; --lv1-ink: #1b2330;
  --lv2: #256abf; --lv2-ink: #ffffff;
  --lv3: #104281; --lv3-ink: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0f141b; --surface: #151b24; --sunken: #1b2330; --ink: #e8edf4; --ink2: #b4bfce; --muted: #8793a4;
    --line: #243040; --axis: #364253; --wash: rgba(232, 237, 244, 0.06);
    --accent: #3987e5; --accent-ink: #86b6ef; --accent-wash: rgba(57, 135, 229, 0.16); --orange: #d95926;
    --attack: #8f9bad; --btn: #256abf; --good-ink: #0ca30c; --crit: #d03b3b; --crit-ink: #ff8a8a;
    --focus: #86b6ef; --shadow: 0 10px 32px rgba(0, 0, 0, 0.5);
    --lv1: #184f95; --lv1-ink: #e8edf4; --lv2: #3987e5; --lv2-ink: #0f141b; --lv3: #b7d3f6; --lv3-ink: #0f141b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0f141b; --surface: #151b24; --sunken: #1b2330; --ink: #e8edf4; --ink2: #b4bfce; --muted: #8793a4;
  --line: #243040; --axis: #364253; --wash: rgba(232, 237, 244, 0.06);
  --accent: #3987e5; --accent-ink: #86b6ef; --accent-wash: rgba(57, 135, 229, 0.16); --orange: #d95926;
  --attack: #8f9bad; --btn: #256abf; --good-ink: #0ca30c; --crit: #d03b3b; --crit-ink: #ff8a8a;
  --focus: #86b6ef; --shadow: 0 10px 32px rgba(0, 0, 0, 0.5);
  --lv1: #184f95; --lv1-ink: #e8edf4; --lv2: #3987e5; --lv2-ink: #0f141b; --lv3: #b7d3f6; --lv3-ink: #0f141b;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: var(--accent-ink); text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
code, pre, textarea.code { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
main:focus { outline: none; }
.skip { position: absolute; left: 8px; top: -48px; background: var(--surface); padding: 8px 12px; border-radius: 6px; z-index: 50; }
.skip:focus { top: 8px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
[hidden] { display: none !important; }

/* ---------- header and run bar ---------- */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 24px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand svg { display: block; }
#nav { display: flex; gap: 2px; flex: 1; overflow-x: auto; scrollbar-width: none; align-self: stretch; }
#nav::-webkit-scrollbar { display: none; }
#nav a { display: flex; align-items: center; padding: 0 12px; color: var(--ink2); text-decoration: none; font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
#nav a:hover { color: var(--ink); background: var(--wash); }
#nav a[aria-current="page"] { color: var(--ink); font-weight: 650; border-bottom-color: var(--accent); }
.runbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.runbar-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.field { display: flex; align-items: center; gap: 8px; }
.field label { color: var(--ink2); font-size: 13.5px; }
.field input { width: 92px; height: 36px; padding: 0 10px; border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); }
.field input.days { width: 68px; }
.runstatus { color: var(--muted); font-size: 13.5px; flex: 1; min-width: 200px; }
.runstatus.err { color: var(--crit-ink); }

/* ---------- buttons and controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 0 14px; border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); color: var(--ink); text-decoration: none; cursor: pointer; font-weight: 550; }
.btn:hover { background: var(--wash); }
.btn.primary { background: var(--btn); border-color: var(--btn); color: #fff; }
.btn.primary:hover { filter: brightness(1.1); background: var(--btn); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink2); }
.btn.quiet:hover { background: var(--wash); color: var(--ink); }
.btn[disabled] { opacity: 0.55; cursor: default; filter: none; }
.btn svg { flex: none; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { min-height: 34px; padding: 0 14px; border: 0; background: transparent; cursor: pointer; color: var(--ink2); font-weight: 500; }
.seg button + button { border-left: 1px solid var(--axis); }
.seg button:hover { background: var(--wash); }
.seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--ink); font-weight: 650; }
select, input[type="search"], input[type="text"] { height: 36px; padding: 0 10px; border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); }

/* ---------- layout ---------- */
main { max-width: 1180px; margin: 0 auto; padding: 28px 16px 72px; transition: opacity 0.15s; }
main.stale { opacity: 0.5; pointer-events: none; }
.stack > * + * { margin-top: 28px; }
.lead h1 { font-size: clamp(26px, 3.4vw, 38px); line-height: 1.12; letter-spacing: -0.025em; font-weight: 700; max-width: 22em; }
.lead .sub { margin-top: 14px; color: var(--ink2); max-width: 46em; font-size: 16px; }
.lead .note { margin-top: 10px; color: var(--muted); max-width: 46em; font-size: 14px; }
h2 { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
h3 { font-size: 15px; font-weight: 650; }
.cap { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding: 16px 18px 0; }
.panel-body { padding: 14px 18px 18px; }
.two { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.sec > h2 { margin-bottom: 4px; }

/* ---------- overview tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tiles > li { display: flex; flex-direction: column; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.tiles .fl { color: var(--ink2); font-size: 13.5px; }
.tiles .big { display: block; margin: 2px 0 6px; font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.tiles p { color: var(--muted); font-size: 13.5px; }
.tiles a { margin-top: auto; padding-top: 10px; font-size: 13.5px; }
.tiles.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }

/* ---------- coverage levels (one blue ramp: mapped, exercised in the lab, seen in a real recording) ---------- */
.swatch, .tile { display: inline-flex; align-items: center; justify-content: center; flex: none; border: 1px solid var(--axis); background: var(--sunken); color: var(--muted); border-radius: 5px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.swatch { font-size: 11px; }
.swatch.lv1, .tile.lv1 { background: var(--lv1); border-color: var(--lv1); color: var(--lv1-ink); }
.swatch.lv2, .tile.lv2 { background: var(--lv2); border-color: var(--lv2); color: var(--lv2-ink); }
.swatch.lv3, .tile.lv3 { background: var(--lv3); border-color: var(--lv3); color: var(--lv3-ink); }
.cov-key { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; color: var(--ink2); font-size: 13.5px; }
.cov-key > span { display: inline-flex; align-items: center; gap: 8px; }
.cov-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(262px, 1fr)); gap: 26px 28px; }
.tactic h3 { font-size: 14.5px; }
.tactic .cap { margin: 0 0 8px; }
.tile-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tile { width: 26px; height: 26px; padding: 0; cursor: pointer; font-size: 12px; transition: transform 0.1s; }
.tile:hover, .tile:focus-visible { transform: scale(1.14); }
.tile.used { outline: 2px solid var(--ink); outline-offset: 1px; }
.tile:focus-visible, .tile.used:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.cov-tools { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.cov-tools label { color: var(--ink2); font-size: 13.5px; }
.cov-tools select { max-width: 100%; }

/* ---------- rule list, search, tests ---------- */
.side { position: sticky; top: 12px; min-width: 0; }
.side-tools { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.side-tools input { width: 100%; }
.list.scroll { max-height: calc(100vh - 150px); overflow-y: auto; }
.tests td:first-child { max-width: 46em; }
.glance { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 22px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.glance dt { color: var(--muted); font-size: 13px; }
.glance dd { font-weight: 600; }
.glance dd .muted { font-weight: 400; }
pre.code-view { margin: 0; padding: 12px 14px; background: var(--sunken); border-radius: 8px; overflow: auto; font-size: 12.5px; line-height: 1.5; max-height: 420px; white-space: pre; }

/* ---------- risk score ---------- */
.fac > li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 7px 0; border-top: 1px solid var(--line); max-width: 46em; }
.fac > li:first-child { border-top: 0; }
.fac-p { font-weight: 650; font-variant-numeric: tabular-nums; }
.fac-bar { grid-column: 1 / -1; height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.fac-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.fac-total { margin-top: 8px; font-weight: 650; }

/* ---------- real recordings ---------- */
.pill.holdout { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-wash); }
.t td ul.mini > li + li { margin-top: 2px; }
.stack-cell { display: flex; flex-direction: column; gap: 2px; }
.prose { max-width: 46em; }
.prose > * + * { margin-top: 12px; }
.prose h2 { margin-top: 30px; font-size: 19px; }
.prose ul.steps li, .prose ol.steps li { max-width: none; }
.prose .tw { margin-top: 14px; }
pre.cmd { margin: 0; padding: 12px 14px; background: var(--sunken); border-radius: 8px; overflow-x: auto; font-size: 13px; line-height: 1.6; }
.fine { color: var(--muted); font-size: 13px; max-width: 60em; }

/* ---------- legend, severity, verdicts ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; padding: 10px 18px 0; color: var(--ink2); font-size: 13.5px; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.sev { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.sev-bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
.sev-bars i { width: 4px; background: var(--axis); border-radius: 1px; }
.sev-bars i:nth-child(1) { height: 5px; } .sev-bars i:nth-child(2) { height: 8px; } .sev-bars i:nth-child(3) { height: 11px; } .sev-bars i:nth-child(4) { height: 14px; }
.sev-bars i.on { background: var(--ink2); }
.sev-high .sev-bars i.on { background: var(--serious); }
.sev-critical .sev-bars i.on { background: var(--crit); }
.sev-t { font-size: 13.5px; }
.verdict { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.verdict svg, .legend svg { flex: none; }
.state { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-weight: 550; }
.state.ok { color: var(--good-ink); }
.state.bad { color: var(--crit-ink); }
.state.same { color: var(--ink2); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--axis); font-size: 12.5px; color: var(--ink2); }

/* ---------- tables ---------- */
.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
.t th { text-align: left; font-weight: 600; color: var(--ink2); font-size: 13px; padding: 9px 12px; border-bottom: 1px solid var(--axis); white-space: nowrap; background: var(--surface); }
.t td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.t tbody th { text-align: left; font-size: 14px; font-weight: 600; color: var(--ink); background: none; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t tr:last-child td, .t tr:last-child th { border-bottom: 0; }
.t td.num, .t th.num { text-align: right; font-variant-numeric: tabular-nums; }
.t tbody tr.click { cursor: pointer; }
.t tbody tr.click:hover td { background: var(--wash); }
.t .idbtn { white-space: nowrap; border: 0; background: none; padding: 0; color: var(--accent-ink); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.t code { font-size: 12.5px; word-break: break-all; }
.t .nowrap { white-space: nowrap; }
.scrollhint { display: none; padding: 0 12px 10px; }
.empty { padding: 28px 18px; color: var(--muted); text-align: center; }
.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 14px; }
.filters .count { color: var(--muted); font-size: 13.5px; margin-left: auto; }

/* ---------- lane chart ---------- */
#lanes { padding: 8px 12px 8px; }
#lanes svg { display: block; width: 100%; height: auto; overflow: visible; }
.grid { stroke: var(--line); stroke-width: 1; }
.track { stroke: var(--line); stroke-width: 1; }
.tick { fill: var(--muted); font-size: 12px; }
.lane-id { fill: var(--ink); font-size: 13px; font-weight: 600; }
.lane-name { fill: var(--muted); font-size: 12.5px; }
a:hover .lane-id { text-decoration: underline; }
.mark { cursor: pointer; outline: none; }
.mark.attack { cursor: default; }
.mark .hit { fill: transparent; stroke: none; }
.mark:focus-visible .hit { stroke: var(--focus); stroke-width: 2; }
.mark .glyph { transform-box: fill-box; transform-origin: center; transition: transform 0.1s; }
.mark:hover .glyph, .mark:focus-visible .glyph { transform: scale(1.3); }
.ring { fill: var(--surface); }
.dot-tp { fill: var(--accent); }
.dot-fp { fill: var(--orange); }
.dot-rel { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.bar-attack { fill: var(--attack); }
.nodata { fill: var(--muted); font-size: 13px; }

/* ---------- time to detect ---------- */
.ttd > li { padding: 10px 0; border-top: 1px solid var(--line); }
.ttd > li:first-child { border-top: 0; padding-top: 2px; }
.ttd-top { display: flex; justify-content: space-between; gap: 12px; }
.ttd-name { font-weight: 550; }
.ttd-rule { color: var(--muted); font-size: 13.5px; white-space: nowrap; }
.ttd-line { position: relative; height: 22px; margin-top: 4px; border-left: 1px solid var(--axis); }
.ttd-bar { position: absolute; left: 0; top: 6px; height: 10px; background: var(--accent); border-radius: 0 4px 4px 0; }
.ttd-val { position: absolute; top: 0; line-height: 22px; font-size: 13.5px; font-weight: 600; white-space: nowrap; padding-left: 8px; }

/* ---------- master detail ---------- */
.md { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.list a.item { display: block; padding: 12px 14px; border-top: 1px solid var(--line); color: var(--ink); text-decoration: none; border-left: 3px solid transparent; }
.list a.item:first-child { border-top: 0; }
.list a.item:hover { background: var(--wash); }
.list a.item[aria-current="true"] { background: var(--accent-wash); border-left-color: var(--accent); }
.item-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.item-id { font-weight: 650; }
.item-title { color: var(--ink2); font-size: 13.5px; margin-top: 2px; }
.item-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
.detail { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px 24px 26px; min-width: 0; }
.detail > * + * { margin-top: 22px; }
.detail h2 { font-size: 21px; letter-spacing: -0.015em; line-height: 1.25; }
.meta-line { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; margin-top: 8px; color: var(--ink2); font-size: 14px; }
.detail h3 { margin-bottom: 8px; }
.steps { list-style: none; }
.steps li { padding: 5px 0 5px 20px; position: relative; max-width: 62em; }
.steps li::before { content: ""; position: absolute; left: 4px; top: 14px; width: 6px; height: 6px; border-radius: 50%; background: var(--axis); }
ol.steps { counter-reset: s; }
ol.steps li { padding-left: 30px; }
ol.steps li::before { counter-increment: s; content: counter(s); width: auto; height: auto; background: none; border-radius: 0; left: 0; top: 5px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
.excl { border-left: 3px solid var(--axis); padding: 4px 0 4px 12px; max-width: 62em; }
.excl + .excl { margin-top: 10px; }
.excl code { font-size: 13px; background: var(--sunken); padding: 1px 6px; border-radius: 4px; }
.tabs { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
pre.sql { margin: 0; padding: 12px 14px; background: var(--sunken); border-radius: 8px; overflow-x: auto; font-size: 12.5px; line-height: 1.5; max-height: 360px; }

/* ---------- cases ---------- */
.ribbon { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; }
.ribbon .step { padding: 3px 10px; border: 1px solid var(--axis); border-radius: 6px; font-size: 13.5px; font-weight: 550; background: var(--surface); }
.ribbon svg { color: var(--muted); }
.timeline { position: relative; }
.timeline li { display: grid; grid-template-columns: 76px 14px minmax(0, 1fr); gap: 0 10px; padding-bottom: 14px; }
.timeline .when { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; padding-top: 2px; text-align: right; }
.timeline .rail { position: relative; }
.timeline .rail::before { content: ""; position: absolute; left: 6px; top: 0; bottom: -14px; width: 1px; background: var(--axis); }
.timeline li:last-child .rail::before { bottom: 6px; }
.timeline .rail i { position: absolute; left: 2px; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink2); }
.timeline li.hit .rail i { background: var(--accent); border-color: var(--accent); }
.timeline code { display: block; margin-top: 4px; padding: 6px 10px; background: var(--sunken); border-radius: 6px; font-size: 12.5px; word-break: break-all; }
.timeline .tl-note { display: block; margin-top: 3px; }
.chips { display: inline-flex; gap: 6px; flex-wrap: wrap; margin-left: 6px; }
.chip { border: 1px solid var(--accent); color: var(--accent-ink); background: var(--accent-wash); border-radius: 999px; padding: 0 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
details.fold { border-top: 1px solid var(--line); padding: 8px 0; }
details.fold summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
details.fold[open] summary { margin-bottom: 6px; }

/* ---------- red team ---------- */
.rt > li { display: grid; grid-template-columns: minmax(0, 1.2fr) 190px minmax(0, 1.2fr); gap: 8px 24px; padding: 16px 0; border-top: 1px solid var(--line); }
.rt > li:first-child { border-top: 0; }
.rt-name { font-weight: 650; }
.rt-desc, .rt-fix { color: var(--ink2); font-size: 14px; }
.rt-fixlabel { font-size: 13px; font-weight: 600; color: var(--ink2); margin-bottom: 2px; }

/* ---------- the lane chart ---------- */
function drawLanes(root, d, alerts, ruleList) {
  const render = () => {
    root.replaceChildren();
    const W = Math.max(320, Math.floor(root.clientWidth));
    const narrow = W < 640, gut = narrow ? 58 : 232, padR = 20, rowH = 38, top = 6, axisH = 30;
    const rows = [{ key: 'attacks' }, ...ruleList.map((r) => ({ key: r.id, rule: r }))];
    const H = top + rows.length * rowH + axisH;
    const t0 = d.timeline.start, t1 = d.timeline.end, plotW = W - gut - padR;
    const x = (t) => gut + ((t - t0) / (t1 - t0)) * plotW;
    const svg = s('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'group',
      'aria-label': 'Chart of alerts over time, one row per rule. The same data is in the table view.' });

    const pxPerDay = plotW / d.meta.days, stepDays = [1, 2, 3, 4, 5, 7, 10].find((n) => n * pxPerDay >= 80) || 10;
    for (let day = 0; day <= d.meta.days; day += stepDays) {
      const tx = x(t0 + day * 86400);
      svg.append(s('line', { class: 'grid', x1: tx, x2: tx, y1: top, y2: top + rows.length * rowH }));
      svg.append(s('text', { class: 'tick', x: tx, y: H - 9, 'text-anchor': day === 0 ? 'start' : (tx > W - 34 ? 'end' : 'middle') }, fmtDay(t0 + day * 86400)));
    }
    rows.forEach((row, i) => {
      const cy = top + i * rowH + rowH / 2;
      svg.append(s('line', { class: 'track', x1: gut, x2: W - padR, y1: cy, y2: cy }));
      if (row.key === 'attacks') {
        svg.append(s('text', { class: 'lane-id', x: 2, y: cy + 4.5 }, narrow ? 'Attacks' : 'Hidden attacks'));
      } else {
        const label = s('a', { href: `#/rules/${row.key}`, 'aria-label': `${row.key}, ${row.rule.title}. Open the rule.` },
          s('text', { class: 'lane-id', x: 2, y: cy + 4.5 }, row.key),
          narrow ? null : s('text', { class: 'lane-name', x: 64, y: cy + 4.5 }, shortTitle(row.rule.title)));
        if (!narrow) label.append(s('title', null, row.rule.title));
        svg.append(label);
      }
    });
    // planted attacks (reference marks)
    d.attacks.forEach((a) => {
      if (a.start == null) return;
      const cy = top + rowH / 2, x1 = x(a.start), w = Math.max(10, x(a.end) - x1);
      const g = s('g', { class: 'mark attack', tabindex: '0', role: 'img',
        'aria-label': `${a.id}, ${a.name}. ${a.caught ? 'Found by ' + a.first_rule + ' after ' + fmtDur(a.ttd_seconds) : 'Not found'}.` },
        s('rect', { class: 'hit', x: x1 - 6, y: cy - 12, width: w + 12, height: 24, rx: 6 }),
        s('rect', { class: 'glyph bar-attack', x: x1, y: cy - 4, width: w, height: 8, rx: 4 }));
      const lines = [`${a.id} ${a.name}`, `${fmtDay(a.start)}, ${new Date(a.start * 1000).toISOString().slice(11, 16)} UTC`,
        a.caught ? `Found by ${a.first_rule} after ${fmtDur(a.ttd_seconds)}` : 'Not found by any rule'];
      g.addEventListener('pointerenter', () => showTip(g, lines)); g.addEventListener('pointerleave', hideTip);
      g.addEventListener('focus', () => showTip(g, lines)); g.addEventListener('blur', hideTip);
      svg.append(g);
    });
    // alerts
    const rowOf = Object.fromEntries(rows.map((r, i) => [r.key, i]));
    // Alerts minutes apart land on the same pixel on a multi-day axis. Stack them above and below the lane's
    // centre line (and nudge sideways if that is still crowded) so each one can be seen and selected.
    const pos = new Map(), placedBy = {};
    [...alerts].sort((p, q) => p.fired_t - q.fired_t).forEach((a) => {
      const i = rowOf[a.rule_id]; if (i == null) return;
      const placed = placedBy[i] || (placedBy[i] = []), base = x(a.fired_t);
      let spot = null;
      for (let shift = 0; !spot; shift += 11) {
        const slot = [0, -9, 9].find((sl) => !placed.some((p) => p.slot === sl && Math.abs(p.x - (base + shift)) < 12));
        if (slot !== undefined) spot = { x: base + shift, slot };
      }
      placed.push(spot);
      pos.set(a.id, { cx: spot.x, cy: top + i * rowH + rowH / 2 + spot.slot, lane: i, hit: 13 });
    });
    // Every mark gets a 26px click area, except in crowded spots, where a smaller one keeps each mark's own centre
    // from falling inside a neighbour's area (marks are at least 9px apart, so an 8px radius never overlaps a centre).
    for (const m of pos.values()) {
      if ([...pos.values()].some((o) => o !== m && o.lane === m.lane && Math.abs(o.cx - m.cx) < 26)) m.hit = 8;
    }
    alerts.forEach((a) => {
      const i = rowOf[a.rule_id]; if (i == null) return;
      const { cx, cy, hit } = pos.get(a.id);
      let shape;
      if (a.verdict === 'FP') shape = [s('path', { class: 'ring', d: `M${cx} ${cy - 8.5}L${cx + 8.5} ${cy}L${cx} ${cy + 8.5}L${cx - 8.5} ${cy}Z` }),
        s('path', { class: 'dot-fp', d: `M${cx} ${cy - 6.5}L${cx + 6.5} ${cy}L${cx} ${cy + 6.5}L${cx - 6.5} ${cy}Z` })];
      else if (a.verdict === 'related') shape = [s('circle', { class: 'ring', cx, cy, r: 7 }), s('circle', { class: 'dot-rel', cx, cy, r: 4 })];
      else shape = [s('circle', { class: 'ring', cx, cy, r: 7 }), s('circle', { class: 'dot-tp', cx, cy, r: 5 })];
      const g = s('g', { class: 'mark', tabindex: '0', role: 'button',
        'aria-label': `${a.id}, ${a.rule_id}, ${VERDICT_TEXT[a.verdict]}, ${describeEntity(a.entity)}, fired ${fmtIso(a.fired_ts)} UTC. Press Enter for evidence.` },
        s('circle', { class: 'hit', cx, cy, r: hit }), s('g', { class: 'glyph' }, ...shape));
      const lines = [`${a.rule_id}  ${VERDICT_TEXT[a.verdict]}`, describeEntity(a.entity), `${fmtIso(a.fired_ts)} UTC`,
        a.attacks.length ? `Part of ${a.attacks.join(', ')}` : '~Select for evidence'];
      g.addEventListener('pointerenter', () => showTip(g, lines)); g.addEventListener('pointerleave', hideTip);
      g.addEventListener('focus', () => showTip(g, lines)); g.addEventListener('blur', hideTip);
      g.addEventListener('click', () => { hideTip(); openAlert(a.id); });
      g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hideTip(); openAlert(a.id); } });
      svg.append(g);
    });
    root.append(svg);
  };
  render();
  let last = root.clientWidth;
  const ro = new ResizeObserver(() => { if (!root.isConnected) { ro.disconnect(); return; } if (Math.abs(root.clientWidth - last) > 4) { last = root.clientWidth; render(); } });
  ro.observe(root);
}

function recordingsFor(rule) {
  const rp = state.data.replay;
  if (!rp) return [];
  const rows = [];
  for (const ds of rp.datasets) {
    const fired = ds.alerts.filter((a) => a.rule_id === rule.id);
    const expected = ds.expected.includes(rule.id);
    if (!fired.length && !expected) continue;
    const result = ds.hit.includes(rule.id) ? 'hit' : ds.missed.includes(rule.id) ? 'missed' : ds.no_data.includes(rule.id) ? 'no_data' : 'extra';
    rows.push({ ds, fired, expected, result });
  }
  return rows;
}
const RESULT_TEXT = { hit: 'Fired as expected', missed: 'Missed', no_data: 'Could not be tested', extra: 'Also fired (not expected)' };
function recordingStatus(result) {
  return result === 'hit' ? status('ok', RESULT_TEXT.hit) : result === 'missed' ? status('bad', RESULT_TEXT.missed)
    : result === 'no_data' ? status('same', RESULT_TEXT.no_data) : status('same', RESULT_TEXT.extra);
}

/* =====================================================================

function coverageIndex(cov) {
  // Every technique that appears in the map (parents and their sub-techniques), by id.
  const byId = {};
  for (const col of cov.columns) for (const cell of col.cells) {
    byId[cell.id] = byId[cell.id] || { id: cell.id, name: cell.name, level: cell.level, rules: cell.rules, parent: null };
    for (const sub of cell.subs) byId[sub.id] = byId[sub.id] || { id: sub.id, name: sub.name, level: sub.level, rules: sub.rules, parent: cell.id };
  }
  return byId;
}
function findCell(cov, id) {
  for (const col of cov.columns) for (const cell of col.cells) if (cell.id === id) return cell;
  return null;
}
function openTechnique(id) {
  const cov = state.data.coverage, cell = findCell(cov, id);
  if (!cell) return;
  const link = attackUrl(cell.id);
  const group = state.covGroup ? cov.groups.find((g) => g.id === state.covGroup) : null;
  const groupHit = group ? Object.keys(group.techniques).filter((t) => t === cell.id || t.startsWith(cell.id + '.')) : [];
  const subRows = cell.subs.map((sub) => h('tr', null,
    h('td', { class: 'nowrap' }, extLink(attackUrl(sub.id), sub.id)),
    h('td', null, sub.name),
    h('td', null, levelChip(sub.level)),
    h('td', null, sub.rules.length ? ruleLinks(sub.rules) : '')));
  const body = h('div', { class: 'drawer-body' },
    kvList([
      ['Evidence', levelChip(cell.best)],
      ['Rules on the technique', cell.rules.length ? ruleLinks(cell.rules) : 'None. Only a sub-technique has a rule, or nothing does.'],
      ['Sub-techniques', cell.subs_total ? `${cell.subs_mapped} of ${cell.subs_total} have a rule` : 'This technique has no sub-techniques.'],
      group ? [`Used by ${group.name}`, groupHit.length ? groupHit.join(', ') : 'Not listed for this group.'] : null,
      link ? ['On attack.mitre.org', extLink(link, cell.id)] : null]),
    cell.subs.length ? section('Sub-techniques', h('div', { class: 'panel' }, table(['ID', 'Name', 'Evidence', 'Rules'], subRows, { caption: 'Sub-techniques' }))) : null,
    h('p', { class: 'cap' }, 'Levels 2 and 3 count only a rule’s main technique. A rule that fires once does not prove it catches every way of using that technique.'));
  openDrawer(`${cell.id} ${cell.name}`, body);
}

  const row = (a, b, c) => h('tr', null, h('th', { scope: 'row' }, a), h('td', null, b), h('td', null, c));
  const checks = table(['Check', 'What it shows', 'What it does not show'], [
    row('Made-up logs with planted attacks', `The rules fire on ${plural(d.attacks.length, 'planted attack')}, tuning removes false alarms, and the numbers can be repeated: the same seed always gives the same logs.`,
      'The same author wrote the attacks and the rules, so a high score is partly circular. It does not say how the rules do on a real network.'),
    row('Public recordings of real attack tools', rp ? `The rules see attack techniques in logs the author did not make. The ${rp.by_split.holdout.datasets} holdout recordings were run once, after the rules were frozen.` : 'Not included in this copy.',
      'Short runs in a lab with little normal activity around them. They say little about false alarms. The expectations and labels are one reviewer’s judgment.'),
    row('Red-team evasion attacks', `Where the rules are blind and what would close each gap. ${rt.caught} of ${rt.total} are caught.`,
      'These were written after the rules, so they test blind spots the author already knew about. Someone else would find others.')], { caption: 'Three checks' });

  const limits = [
    'Nothing here ran on a real company’s network. This is a lab, and it is described as one.',
    `ATT&CK coverage is a map of where to look. ${cov.summary.parents_with_any} of ${cov.summary.parents} techniques have a rule, and having a rule does not mean every way of using the technique is caught.`,
    `pySigma converted ${q.splunk.ok} rules to Splunk and ${q.kql.ok} to Sentinel${q.splunk.failed + q.kql.failed ? `; ${plural(q.splunk.failed + q.kql.failed, 'conversion')} failed and ${q.splunk.failed + q.kql.failed === 1 ? 'is' : 'are'} marked on the rule pages` : ''}. None of the queries has been run on a live SIEM, and field names depend on how logs are mapped.`,
    'The case risk score is a sum chosen by hand, checked only on made-up cases. Host and account name prefixes stand in for a real asset inventory.',
    'The numbers on these pages are produced by running the code, not typed in. Change a rule or the seed and they change with it.',
    'This project was built with the help of an AI assistant (Claude, by Anthropic). The checks above exist so that its claims do not rest on trust: run them.'];

  mount(h('div', { class: 'stack' },
    h('section', { class: 'lead' },
      h('h1', null, 'How this lab was built and measured.'),
      h('p', { class: 'sub' }, 'Detection Lab is a project about detection engineering: writing rules as code, proving that they work, tuning them with written reasons, and handing analysts cases they can act on. It runs on one computer with Python and nothing else to install.')),
    h('div', { class: 'prose' },
      h('h2', null, 'What is in it'),
      h('ul', { class: 'steps' }, [
        `${d.rules.length} detection rules as text files, each with an ATT&CK mapping, triage questions, response steps, unit tests and a written reason for every exclusion.`,
        `A test runner: ${nf(ts.total)} unit tests, a check that every exclusion is needed by at least one test (${ts.exclusions_proven} of ${ts.exclusions} are), and a mutation check that edits each rule in small ways and looks for a test that fails (${ts.edits_caught} of ${ts.edits} edits are noticed).`,
        `A generator of made-up logs with ${plural(d.attacks.length, 'planted attack')} and a scorer for precision, recall and time to detect.`,
        'A case builder that groups alerts sharing an account, address or host, and ranks the cases with a risk score you can read.',
        rp ? `A replay of ${rp.summary.datasets} public attack recordings through the same rules, with a holdout set that was run once.` : null,
        `A red-team set of ${rt.total} evasion attacks written to slip past the rules, with the fix or the open gap for each.`,
        `Sigma export of ${ss.exported} rules, with Splunk and Sentinel queries made from them.`,
        `An ATT&CK v${cov.attack.version} coverage map built from the rules.`,
        SNAP ? 'This page: a read-only copy of the lab with every result saved inside it. It makes no network requests. To change a rule or the seed, run the lab on your own computer.'
          : 'This page, which runs only on your computer.'].filter(Boolean).map((t) => h('li', null, t))),

      h('h2', null, 'Three ways the rules were checked'),
      checks,

      h('h2', null, 'What the numbers do not show'),
      h('ul', { class: 'steps' }, limits.map((t) => h('li', null, t))),

      h('h2', null, 'Run it yourself'),
      h('p', null, 'Install Python 3.11 or newer, download the project, open a terminal in its folder, and run:'),
      h('pre', { class: 'cmd', tabindex: '0' }, [
        'python -m detlab app            # this web page, on your own computer',
        'python -m detlab test-rules     # run every rule’s unit tests',
        'python -m detlab replay         # replay the real recordings',
        'python -m detlab coverage       # print the ATT&CK coverage',
        'python -m detlab export-sigma   # rewrite the sigma/ folder'].join('\n')),
      h('p', null, (SNAP ? 'Run on your own computer, the web page' : 'The web page') + ' lets you change the seed, edit any rule, and see the effect on alerts, cases and red-team results. Nothing it does is saved unless you change a file yourself.'),

      h('h2', null, 'Credits and licenses'),
      h('ul', { class: 'steps' }, [
        rp ? ['The recordings are from ', extLink(rp.source.url, rp.source.name), `, version ${rp.source.commit.slice(0, 7)}. License: ${rp.source.license}`] : null,
        ['ATT&CK® is a registered trademark of The MITRE Corporation. ', cov.attack.notice],
        'Sigma is an open rule format. The Sigma and SIEM query conversions were made and checked with pySigma and its Splunk and Kusto backends. They are not part of the lab itself.',
        'A pure-Python copy of PyYAML (MIT license) is bundled as a fallback, so the lab runs without installing anything.'].filter(Boolean).map((t) => h('li', null, t))))));
}

/* =====================================================================
   Router, shell, run controls
   ===================================================================== */
const TABS = [['overview', 'Overview'], ['real', 'Real recordings'], ['coverage', 'Coverage'], ['rules', 'Rules'], ['cases', 'Cases'], ['alerts', 'Alerts'],
  ['redteam', 'Red team'], ['playground', SNAP ? 'Rule files' : 'Playground'], ['about', 'About']];
function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  const tab = TABS.some(([k]) => k === parts[0]) ? parts[0] : 'overview';
  return { tab, arg: decodeURIComponent(parts[1] || '') };
}
function mount(node) { $('#view').replaceChildren(node); }
function setStatus(text, isError) { const el = $('#runstatus'); el.textContent = text; el.classList.toggle('err', !!isError); }
let lastTab = null;
function render() {
  if (!state.data) return;
  const { tab, arg } = route();
  $('#nav').replaceChildren(...TABS.map(([k, t]) => h('a', { href: `#/${k}`, 'aria-current': k === tab ? 'page' : null }, t)));
  document.title = `${TABS.find(([k]) => k === tab)[1]} - Detection Lab`;
  hideTip();
  const scroll = scrollY;
  ({ overview: viewOverview, real: viewReal, coverage: viewCoverage, rules: viewRules, alerts: viewAlerts, cases: viewCases,
     redteam: viewRedTeam, playground: viewPlayground, about: viewAbout })[tab](arg);
  if (lastTab !== tab) { scrollTo(0, 0); lastTab = tab; } else scrollTo(0, scroll);
}
function applyData(data) {
  state.data = data; state.caseCache = {}; state.tests = {};
  const m = data.meta;
  if (SNAP) {
    setStatus(`Read-only copy. ${nf(m.events)} made-up log events, ${m.users} users, ${m.days} days from ${m.start}, seed ${m.seed}.`);
    return;
  }
  $('#seed').value = m.seed; $('#days').value = m.days; $('#days').min = m.limits.min_days; $('#days').max = m.limits.max_days; $('#seed').max = m.limits.max_seed;
  setStatus(`${m.events.toLocaleString('en-US')} log events, ${m.users} users, ${m.days} days from ${m.start}. Same seed and days always give the same logs.`);
}
$('#runform').addEventListener('submit', async (e) => {
  e.preventDefault();
  const whole = (t) => (/^\d{1,9}$/.test(t.trim()) ? Number(t.trim()) : NaN);   // empty or non-digits become NaN
  const seed = whole($('#seed').value), days = whole($('#days').value), lim = state.data ? state.data.meta.limits : { min_days: 14, max_days: 30, max_seed: 1000000 };
  if (!Number.isInteger(seed) || seed < 0 || seed > lim.max_seed) { setStatus(`The seed must be a whole number from 0 to ${lim.max_seed.toLocaleString('en-US')}.`, true); return; }
  if (!Number.isInteger(days) || days < lim.min_days || days > lim.max_days) { setStatus(`Days must be a whole number from ${lim.min_days} to ${lim.max_days}.`, true); return; }
  const btn = $('#runbtn'); btn.disabled = true; $('#view').classList.add('stale'); setStatus('Generating new logs and running every rule...');
  try { applyData(await postJson('/api/run', { seed, days })); closeDrawer(); render(); }
  catch (err) { setStatus(err.message, true); }
  btn.disabled = false; $('#view').classList.remove('stale');
});
addEventListener('hashchange', () => { closeDrawer(); render(); });
if (SNAP) {
  // No server behind this copy: the controls that need one are replaced by a note and a link.
  $('#runform').replaceChildren(
    h('p', { class: 'runstatus', id: 'runstatus', role: 'status', 'aria-live': 'polite' }, 'Loading the lab...'),
    h('a', { class: 'btn', href: '#/about' }, 'Run it on your computer'));
}

/* theme: Auto, Light, Dark */
const THEMES = ['auto', 'light', 'dark'];
function setTheme(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t;
  $('#theme').textContent = `Theme: ${cap1(t)}`; $('#theme').dataset.theme = t;
  try { localStorage.setItem('detlab-theme', t); } catch (e) { /* storage can be blocked */ }
  if (state.data) render();
}
$('#theme').addEventListener('click', () => setTheme(THEMES[(THEMES.indexOf($('#theme').dataset.theme) + 1) % 3]));
let saved = 'auto'; try { saved = localStorage.getItem('detlab-theme') || 'auto'; } catch (e) { /* ignore */ }
setTheme(THEMES.includes(saved) ? saved : 'auto');

(async () => {
  $('#view').append(h('p', { class: 'muted' }, 'Building the lab...'));
  try { applyData(await getJson('/api/lab')); render(); }
  catch (err) { $('#view').replaceChildren(h('div', { class: 'errors' }, err.message)); setStatus('The lab did not load.', true); }
})();
})();
</script>
</body>
</html>
